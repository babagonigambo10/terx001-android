name: Build APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Verify release signature (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$OUT"
          echo "$OUT" | grep -qi "111620d75dd975516a20dd72b77a23ccb3cf66538ded1dfeab721e30f082d5e0" || { echo "Release APK is NOT signed with the expected key"; exit 1; }

      - name: List runtime dependencies (for licence notices)
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --quiet

      - name: APK sizes and checksums
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          echo "--- biggest files inside the release APK (uncompressed, compressed, name) ---"
          unzip -lv app/build/outputs/apk/release/app-release.apk | sort -k1 -n -r | head -15

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="TERX001-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SUM  $APK" > SHA256SUMS.txt
          cat > notes.md <<EOF
          TERX001 $TAG (beta) - free video downloader that runs on your phone. No ads, no accounts, no tracking.

          Install: download $APK, open it, and allow installing unknown apps if Android asks. Needs Android 10 or newer on a 64-bit (arm64) phone. If you installed a test build before, uninstall it once first.

          Works with TikTok, Instagram and Snapchat links. X, Facebook, YouTube, Pinterest, Reddit and Threads are experimental.

          Verify your download:
          - APK SHA-256: $SUM
          - Signing certificate SHA-256: 11:16:20:D7:5D:D9:75:51:6A:20:DD:72:B7:7A:23:CC:B3:CF:66:53:8D:ED:1D:FE:AB:72:1E:30:F0:82:D5:E0

          Source: this repository at tag $TAG (GPL-3.0-only). Privacy policy and terms are in the docs folder. Download only content you own or have permission to save.
          EOF
          gh release create "$TAG" "$APK" SHA256SUMS.txt --title "TERX001 $TAG (beta)" --notes-file notes.md --prerelease --verify-tag

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
