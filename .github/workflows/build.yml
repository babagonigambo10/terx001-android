name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: APK sizes and checksums
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          echo "--- biggest files inside the release APK (uncompressed, compressed, name) ---"
          unzip -lv app/build/outputs/apk/release/app-release.apk | sort -k1 -n -r | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
