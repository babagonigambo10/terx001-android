name: Build APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Verify release signature (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256 digest)"

      - name: List runtime dependencies (for licence notices)
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --quiet

      - name: APK sizes and checksums
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          echo "--- biggest files inside the release APK (uncompressed, compressed, name) ---"
          unzip -lv app/build/outputs/apk/release/app-release.apk | sort -k1 -n -r | head -15

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: terx001-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
